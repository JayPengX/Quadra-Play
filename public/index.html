<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#1f5fb0" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="build-version" content="dev" />
<script>
  // Always the newest deploy: when a newer version is out than this page
  // (a browser can keep an old copy of it), reload once under a new address,
  // which fetches the page and every file fresh. Checked on open and whenever
  // the tab comes back.
  (function () {
    var mine = document.querySelector('meta[name="build-version"]').content;
    if (mine === 'dev') return;
    function check() {
      fetch('./version.json?t=' + Date.now(), { cache: 'no-store' })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (latest) {
          if (!latest || !latest.version || latest.version === mine) return;
          try {
            if (sessionStorage.getItem('oddsStudy.reloadedTo') === latest.version) return;
            sessionStorage.setItem('oddsStudy.reloadedTo', latest.version);
          } catch (e) {}
          location.replace(location.pathname + '?v=' + latest.version + location.hash);
        })
        .catch(function () {});
    }
    check();
    document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') check(); });
  })();
</script>

<body>
<div id="loading" data-title="Quadra Play" data-cache="quadra-odds-"></div>
<script src="./boot.js"></script>
<header class="q-appbar">
  <div class="q-appbar-inner">
    <div class="q-brand">
      <img class="q-brand-logo" src="./favicon.svg" alt="" width="34" height="34" />
      <div class="q-brand-text">
        <h1 id="title">Quadra Play</h1>
        <p id="status" class="q-status" aria-live="polite"></p>
      </div>
    </div>
    <nav id="tabs" class="q-tabbar" role="tablist"></nav>
    <div id="top-actions" class="q-actions"></div>
  </div>
</header>

<main class="page">
  <div id="panel-home" class="tab-panel" role="tabpanel" aria-labelledby="tab-home">
    <div id="home-body"></div>
  </div>

  <div id="panel-games" class="tab-panel" role="tabpanel" aria-labelledby="tab-games">
    <div class="search-box">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="game-search" type="search" autocomplete="off" enterkeyhint="search" />
    </div>
    <div class="toolbar">
      <nav id="sport-filter" class="chips" aria-label="sport"></nav>
      <nav id="league-filter" class="chips league-chips" aria-label="league" hidden></nav>
      <nav id="day-filter" class="chips" aria-label="day"></nav>
    </div>
    <p id="wanted-note" class="wanted-note" role="status" hidden></p>

    <section id="live" aria-labelledby="live-title" hidden>
      <div class="games-head">
        <h2 id="live-title" class="section-heading"></h2>
        <span id="live-updated" class="games-hint"></span>
      </div>
      <div id="live-list" class="games-grid"></div>
    </section>

    <section id="games" aria-labelledby="games-title">
      <div class="games-head">
        <h2 id="games-title" class="section-heading"></h2>
        <span class="games-hint" data-t="legendTap"></span>
      </div>
      <div id="games-list" class="games-grid"></div>
    </section>

    <section id="f1" aria-labelledby="f1-title">
      <h2 id="f1-title" class="section-heading"></h2>
      <div id="f1-body"></div>
    </section>
    <section id="moto" aria-labelledby="moto-title" hidden>
      <h2 id="moto-title" class="section-heading"></h2>
      <div id="moto-body"></div>
    </section>

    <section id="futures" aria-labelledby="futures-title">
      <h2 id="futures-title" class="section-heading"></h2>
      <div id="futures-list" class="games-grid"></div>
    </section>
    <p id="games-footnote" class="footnote" role="note" hidden></p>
    <p id="notice" hidden></p>
  </div>

  <div id="panel-lottery" class="tab-panel" role="tabpanel" aria-labelledby="tab-lottery" hidden>
    <div id="lottery-body"></div>
  </div>

  <div id="panel-slip" class="tab-panel" role="tabpanel" aria-labelledby="tab-slip">
    <section id="parlay" aria-labelledby="parlay-title">
      <h2 id="parlay-title" class="section-heading"></h2>
      <div id="parlay-body"></div>
    </section>
  </div>

  <div id="panel-history" class="tab-panel" role="tabpanel" aria-labelledby="tab-history">
    <section id="account" aria-labelledby="account-title">
      <h2 id="account-title" class="section-heading"></h2>
      <div id="account-body"></div>
    </section>
    <div id="history-tabs" class="segmented history-tabs" role="group" hidden></div>
    <section id="stats" aria-labelledby="stats-title" hidden>
      <h2 id="stats-title" class="section-heading"></h2>
      <div id="stats-body"></div>
    </section>
    <section id="tickets" aria-label="lottery tickets" hidden>
      <div id="tickets-body"></div>
    </section>
    <section id="saved" aria-labelledby="saved-title" hidden>
      <h2 id="saved-title" class="section-heading"></h2>
      <div id="saved-body"></div>
    </section>
  </div>

  <footer><p id="footer" class="muted"></p></footer>
</main>
<script type="module" src="./app.js" onerror="window.__oddsFail()"></script>
</body>
</html>
